baseURL: https://therahulbhati.github.io/
languageCode: en-us
title: Rahul Bhati
theme: ["PaperMod"]
pagination:
  pagerSize: 5

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Rahul Bhati
  subtitle: "Backend Engineering | Distributed Systems | System Design"
  description: "Backend engineer writing about distributed systems, microservices architecture, message queues, databases, and building scalable infrastructure. Sharing practical insights from working with high-throughput systems."
  keywords: [Backend Engineering, Distributed Systems, System Design, Microservices, Message Queues, Golang, Databases, PostgreSQL, Redis, Kafka, Kubernetes, Scalable Architecture, Software Engineering, Infrastructure]
  author: Rahul Bhati
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false


  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋"
    Content: I'm a backend engineer building highly scalable distributed systems. I write about system design, databases, and infrastructure.

  socialIcons:
    - name: x
      url: "https://x.com/TheRahulBhati"
    - name: linkedin
      url: "https://www.linkedin.com/in/therahulbhati/"
    - name: github
      url: "https://github.com/therahulbhati"
    - name: rss
      url: "/index.xml"
  