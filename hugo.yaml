baseURL: https://therahulbhati.github.io/
languageCode: en-us
title: Rahul Bhati
theme: ["PaperMod"]
pagination:
  pagerSize: 5

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Rahul Bhati
  subtitle: "Tech Blog | System Design | Distributed Systems"
  description: "This is my personal blog where I write about tech, fitness and more."
  keywords: [Blog, Tech, System Design, Distributed Systems, golang, rust, programming, database systems, fitness, health] 
  author: Rahul Bhati
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false


  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋"
    Content: I'm a software engineer. I write about tech and fitness.

  socialIcons:
    - name: x
      url: "https://x.com/TheRahulBhati"
    - name: linkedin
      url: "https://www.linkedin.com/in/therahulbhati/"
    - name: github
      url: "https://github.com/therahulbhati"
  