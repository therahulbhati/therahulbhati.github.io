baseURL: https://therahulbhati.github.io/
languageCode: en-us
title: Rahul Bhati
theme: ["PaperMod"]
pagination:
  pagerSize: 5

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Rahul Bhati
  subtitle: "Backend Engineering | Distributed Systems | Deep Learning & Inference"
  description: "Backend engineer writing about distributed systems, microservices architecture, message queues, databases, and building scalable infrastructure. Also writing about deep learning and inference engineering, neural networks built from first principles, explained with the math and the PyTorch code side by side."
  keywords: [Backend Engineering, Distributed Systems, System Design, Microservices, Message Queues, Golang, Databases, PostgreSQL, Redis, Kafka, Kubernetes, Scalable Architecture, Software Engineering, Infrastructure, Deep Learning, Machine Learning, Neural Networks, PyTorch, Inference Engineering, Model Serving]
  author: Rahul Bhati
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false


  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋"
    Content: I'm a backend engineer building highly scalable distributed systems. I write about system design, databases, infrastructure, deep learning, and inference engineering.

  socialIcons:
    - name: x
      url: "https://x.com/TheRahulBhati"
    - name: linkedin
      url: "https://www.linkedin.com/in/rjbhati/"
    - name: github
      url: "https://github.com/therahulbhati"
    - name: rss
      url: "/index.xml"
  